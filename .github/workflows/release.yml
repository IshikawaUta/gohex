name: Release

# Tag-driven release pipeline: cross-compiled CLI binaries, GUI packages
# (deb/rpm/AppImage on Linux; NSIS on Windows and a .app on macOS are
# best-effort), SHA-256 checksums and an optional detached GPG signature.
# See docs/release.md for the checklist and the signing story.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.27

jobs:
  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build gohex-cli (pure Go, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-w -s" \
            -o "dist/gohex-cli-${GOOS}-${GOARCH}${ext}" ./cmd/gohex-cli

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  gui-linux:
    name: GUI packages (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: WebView/GTK headers (cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build production binary
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 build

      - name: Package deb, rpm, AppImage
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          wails3 task linux:create:appimage

      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: |
            bin/gohex
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
          if-no-files-found: error

  gui-windows:
    name: GUI installer (windows)
    # Best-effort until the Windows toolchain is proven in CI (same policy
    # as the CI build matrix); a failure must not block the release.
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Windows dependencies (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: NSIS
        run: choco install nsis -y --no-progress

      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build + NSIS installer
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 build
          wails3 task windows:package

      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: |
            bin/gohex.exe
            bin/*.exe
          if-no-files-found: error

  gui-macos:
    name: GUI app bundle (macos)
    # Best-effort; signing/notarization needs Apple credentials and is a
    # documented manual step (docs/release.md), not wired here.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build + .app bundle
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 build
          wails3 task darwin:package
          cd bin
          zip -ry gohex-macos.zip gohex.app

      - uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: bin/gohex-macos.zip
          if-no-files-found: error

  release:
    name: Checksums + GitHub release
    needs: [cli, gui-linux, gui-windows, gui-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the stamped version
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(sed -n 's/^var Version = "\(.*\)".*/\1/p' pkg/version/version.go)"
          cfg="$(grep -E '^  version: ' build/config.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$want pkg/version=$got build/config.yml=$cfg"
          [ "$want" = "$got" ] || { echo "pkg/version.Version != tag"; exit 1; }
          [ "$want" = "$cfg" ] || { echo "build/config.yml version != tag"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 checksums
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS*' -printf '%P\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Detach GPG signature (skipped without secrets)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured — publishing unsigned checksums."
            exit 0
          fi
          gpg --batch --import <<<"$GPG_PRIVATE_KEY"
          fpr="$(gpg --batch --with-colons --import-options show-only --dry-run \
            --import <<<"$GPG_PRIVATE_KEY" | awk -F: '/^fpr:/{print $10; exit}')"
          echo "signing with fingerprint $fpr"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 -u "$fpr" --detach-sign --armor dist/SHA256SUMS.txt
          else
            gpg --batch --yes -u "$fpr" --detach-sign --armor dist/SHA256SUMS.txt
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "GoHex $GITHUB_REF_NAME" \
            --generate-notes
