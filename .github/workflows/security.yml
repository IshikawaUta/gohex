# Supply-chain and code-quality gates that complement ci.yml.
# Everything here is also runnable locally; see each "run:" block.

name: Security & supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: golangci-lint (gofumpt · gosec · errcheck · …)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: WebView/GTK headers (cgo packages compile under vet)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      # main.go embeds frontend/dist; package main fails to typecheck
      # without it. A placeholder file satisfies the embed — the lint
      # job never serves the UI, it only needs the package to load.
      - name: Satisfy //go:embed frontend/dist
        run: |
          mkdir -p frontend/dist
          echo placeholder > frontend/dist/index.html
      # Build the linter from source with the runner's toolchain: the
      # prebuilt v1.64 binaries are compiled with go1.24 and refuse to
      # load modules targeting go1.25.
      - name: Install golangci-lint (from source)
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m ./internal/... ./pkg/... ./cmd/... .

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Satisfy //go:embed frontend/dist
        run: |
          mkdir -p frontend/dist
          echo placeholder > frontend/dist/index.html
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — leaks live in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key needed for public repositories.

  sbom:
    name: SBOM (CycloneDX) + checksums
    runs-on: ubuntu-latest
    needs: [lint, vulncheck, secrets]
    permissions:
      contents: write # upload release-adjacent artifacts on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -ss -- -b /usr/local/bin
      - name: Generate SBOM for the module
        run: |
          syft dir:. -o cyclonedx-json=gohex.cdx.json -o spdx-json=gohex.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            gohex.cdx.json
            gohex.spdx.json

  # Cosign keyless signing is wired for release tags only: it needs an
  # id-token and the public Sigstore transparency log, which make no
  # sense on ordinary PRs. Kept here so the workflow is the single
  # source of truth; release.yml calls the same action on tag pushes.
  provenance-docs:
    name: Verify signing docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/security.md must mention cosign + SBOM
        run: |
          grep -qi cosign docs/security.md
          grep -qi sbom docs/security.md
